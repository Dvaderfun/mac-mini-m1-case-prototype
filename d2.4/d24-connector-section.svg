<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="d24st d24sd">
 <title id="d24st">Задня панель D2.4: розріз через середину Thunderbolt</title>
 <desc id="d24sd">Переріз експортованих стінки та гнізда в одному масштабі. Пластик облягає гніздо з боків і лежить позаду лицьової площини. Велике плече показаного схематично кабелю залишається зовні.</desc>
