 <text x="46" y="120" class="ey" text-anchor="start">ВСЕРЕДИНІ</text><text x="411" y="120" class="ey" text-anchor="end">ЗОВНІ</text>
 <text x="456" y="126" class="name" text-anchor="start">Зовнішнє лице</text>
 <text x="456" y="150" class="note" text-anchor="start">Зелений пунктир — площина,</text><text x="456" y="168" class="note" text-anchor="start">яка лежить на столі при друці.</text>
 <text x="456" y="204" class="name" text-anchor="start">1,50 мм пластику</text>
 <text x="456" y="227" class="note" text-anchor="start">Від лиця вглиб корпуса,</text><text x="456" y="245" class="note" text-anchor="start">виміряно на перерізі CAD.</text>
 <text x="456" y="283" class="name" text-anchor="start">Передня кромка TB</text>
 <text x="456" y="307" class="note" text-anchor="start">0,05 мм за лицем у моделі.</text>
 <text x="456" y="347" class="name" text-anchor="start">Плече кабелю</text>
 <text x="456" y="371" class="note" text-anchor="start">Світло-зеленим — приклад</text><text x="456" y="389" class="note" text-anchor="start">штекера. Широка частина зовні;</text><text x="456" y="407" class="note" text-anchor="start">її відступ залежить від кабелю.</text>
 <path d="M30 453H730" stroke="#bdc8bc"/>
 <text x="30" y="477" class="ey" text-anchor="start">ТОРЕЦЬ ВІДНОСНО ЛИЦЯ   /   «+» НАЗОВНІ   /   НОМІНАЛ CAD</text>
 <text x="30" y="513" class="label" text-anchor="start">USB-A, HDMI, RJ, аудіо</text><text x="196" y="514" class="big" text-anchor="start">+0,05 мм</text>
 <text x="338" y="513" class="label" text-anchor="start">TB ×2</text><text x="397" y="514" class="big" text-anchor="start">−0,05 мм</text>
 <text x="544" y="513" class="label" text-anchor="start">PD IN*</text><text x="620" y="514" class="big" text-anchor="start">0,00 мм</text>
 <text x="513" y="532" class="note" text-anchor="start">* положення модуля — припущення</text>
