<svg xmlns="http://www.w3.org/2000/svg" width="840" height="532" viewBox="0 0 840 532" role="img" aria-labelledby="title desc">
 <title id="title">D2.3: як плече кабелю проходить біля задньої стінки</title>
 <desc id="desc">У розрізі HDMI до фасаду 1,50 мм, плече штекера може залишитися назовні. Ширше вікно USB-C пропускає його пластиковий корпус аж до торця гнізда. Жовтим позначено 1,20 мм пластику перед гніздами Mac.</desc>
 <defs>
   <pattern id="plastic" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#f1c775"/><path d="M-2 2 2-2 M0 9 9 0 M7 11 11 7" stroke="#bc8a40" stroke-width="1"/></pattern>
   <g id="ticks"><path d="M0 -5V5" fill="none" stroke="#3c554c" stroke-width="1.5"/></g>
   <style>text{font:15px 'Segoe UI',Arial,sans-serif;fill:#233b30}.h{font-size:29px;font-weight:660}.t{font-size:20px;font-weight:650}.k{font-size:12px;letter-spacing:1.7px;font-weight:700}.small{font-size:13px}.measure{font-size:14px;font-weight:600}.guide{fill:none;stroke:#66796e;stroke-dasharray:3 5}.dim{stroke:#3c554c;fill:none}.socket{fill:#a9b9b1;stroke:#536b61;stroke-width:1.3}.tip{fill:#e5e9e5;stroke:#627970;stroke-width:1.4}.boot{fill:#408068;stroke:#305d4c;stroke-width:1.4}</style>
 </defs>
 <rect width="840" height="532" rx="12" fill="#f7f8f3"/>
 <text x="32" y="37" class="k">MAC MINI M1  /  D2.3  /  РОЗРІЗ УЗДОВЖ ШТЕКЕРА</text>
 <text x="32" y="75" class="h">Де зупиняється пластикове плече</text>
 <line x1="32" y1="93" x2="808" y2="93" stroke="#bac8bc"/>
 <text x="33" y="127" class="t">HDMI Type A</text><text x="483" y="126" class="small">Зсередини корпуса → назовні, до кабелю</text>
 <!-- Common distance scale 80 px/mm along Y. The vertical section is illustrative. -->
 <path d="M63 178H248V191H85V215H248V228H63Z" class="socket"/>
 <path d="M198 194H408V212H198Z" class="tip"/>
 <rect x="408" y="183" width="127" height="40" rx="4" class="boot"/><path d="M535 203H574" stroke="#66796e" stroke-width="9"/>
 <path d="M272 158H368V179H272ZM272 227H368V247H272Z" fill="url(#plastic)"/>
 <path d="M248 167V254 M368 152V254 M408 171V254" class="guide"/>
 <path d="M248 156H368" class="dim"/><use href="#ticks" x="248" y="156"/><use href="#ticks" x="368" y="156"/>
 <text x="308" y="148" text-anchor="middle" class="measure">1,50 мм</text>
 <path d="M248 257H408" class="dim"/><use href="#ticks" x="248" y="257"/><use href="#ticks" x="408" y="257"/>
 <text x="328" y="278" text-anchor="middle" class="measure">2,00 мм мін. у з’єднаній парі</text>
 <text x="602" y="188" class="measure">Широке плече зовні</text><text x="602" y="211" class="small">Номінально лишається 0,50 мм;</text><text x="602" y="230" class="small">при люфті назовні — 0,33 мм.</text>
 <line x1="32" y1="299" x2="808" y2="299" stroke="#d0d9d0"/>
 <text x="32" y="330" class="t">Thunderbolt / USB‑C</text>
 <path d="M63 376H248V387H85V410H248V421H63Z" class="socket"/>
 <path d="M201 390H256V407H201Z" class="tip"/><rect x="256" y="380" width="264" height="37" rx="3" class="boot"/>
 <path d="M520 398H574" stroke="#66796e" stroke-width="9"/>
 <path d="M280 352H376V372H280ZM280 424H376V444H280Z" fill="url(#plastic)"/>
 <path d="M248 362V451 M376 345V451" class="guide"/>
 <path d="M248 349H376" class="dim"/><use href="#ticks" x="248" y="349"/><use href="#ticks" x="376" y="349"/>
 <text x="312" y="340" text-anchor="middle" class="measure">1,60 мм</text>
 <path d="M280 449H376" class="dim"/><use href="#ticks" x="280" y="449"/><use href="#ticks" x="376" y="449"/>
 <text x="328" y="470" text-anchor="middle" class="measure">1,20 мм пластику</text>
 <text x="602" y="383" class="measure">Плече входить у вікно</text><text x="602" y="405" class="small">Калібр прямого USB‑C:</text><text x="602" y="424" class="small">12,85 × 7,00 мм у перерізі.</text>
 <line x1="32" y1="486" x2="808" y2="486" stroke="#bac8bc"/>
 <rect x="34" y="502" width="19" height="12" fill="url(#plastic)"/><text x="62" y="513" class="small">панель</text>
 <rect x="158" y="502" width="19" height="12" class="socket"/><text x="186" y="513" class="small">гніздо</text>
 <rect x="280" y="502" width="19" height="12" class="boot"/><text x="308" y="513" class="small">плече штекера</text>
 <text x="488" y="513" class="small">Номінали CAD; висоти на схемі умовні.</text>
</svg>
